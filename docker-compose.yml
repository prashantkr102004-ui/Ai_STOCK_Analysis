services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marketguard
      POSTGRES_USER: marketguard
      POSTGRES_PASSWORD: marketguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://marketguard:marketguard@postgres:5432/marketguard
      DATA_PATH: data/stocks
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  postgres_data:
